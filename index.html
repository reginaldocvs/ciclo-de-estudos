/* ===== Visual novo: sidebar flutuante, cartões suaves, paleta índigo ===== */
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--font);-webkit-font-smoothing:antialiased;padding-block:20px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,textarea{font-family:inherit}
h2{font-size:1.125rem;font-weight:800;letter-spacing:-.01em;text-wrap:balance}
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);gap:24px;max-width:1400px;margin:0 auto;align-items:start}
main{min-width:0;max-width:none;margin:0;padding:0}
body:not(.wide) #app{max-width:940px}
/* Barra lateral */
.side{position:sticky;top:20px;display:flex;flex-direction:column;gap:20px;background:var(--card);border-radius:20px;box-shadow:var(--sh);padding:22px 14px 16px;min-height:min(720px,calc(100vh - 40px));min-height:min(720px,calc(100dvh - 40px))}
.sbrand{display:flex;align-items:center;gap:10px;padding:0 8px;font-weight:800;font-size:1.125rem;line-height:1.05;letter-spacing:-.01em}
/* Nome da marca: só quebra entre "Ciclo" e "de Estudos" (nunca 3 linhas); na barra lateral fica sempre em 2 linhas */
.bnm{min-width:0}.bnm>span{white-space:nowrap}.sbrand .bnm>span{display:block}
.sbrand .logo{width:38px;height:38px}
.sidenav{display:flex;flex-direction:column;gap:4px;flex:1}
.sidenav button,.tabbar button{font:inherit;background:none;border:0;cursor:pointer;color:var(--mut);font-weight:600}
.sidenav button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:11px 12px;border-radius:12px;transition:background .15s,color .15s}
.sidenav button:hover{background:var(--track);color:var(--ink)}
.sidenav button[aria-current=page],.tabbar button[aria-current=page],.sidenav button[data-nav=pl].on,.tabbar button[data-nav=pl].on{color:var(--act)}
.sidenav button[aria-current=page]{background:color-mix(in srgb,var(--ac) 12%,var(--card))}
.sidenav svg,.tabbar svg{width:20px;height:20px;flex:none}
.sidenav .navend{margin-top:auto}
.mbar,.tabbar{display:none}
/* Cabeçalho da página */
.pagehead{margin:2px 0 18px}
#mtt{display:block;margin:0;font-size:2rem;font-weight:800;letter-spacing:-.02em;line-height:1.2;text-wrap:balance;color:var(--ink)}
#msub{margin:4px 0 0;color:var(--mut);font-weight:500}
/* Indicadores do ciclo no subtítulo: chips tonais, valor em destaque */
#msub:has(.kchs){margin-top:10px;container-type:inline-size}.kchs{display:flex;flex-wrap:wrap;gap:6px}
.kch{display:inline-flex;align-items:baseline;gap:5px;padding:5px 12px;border-radius:var(--r-s);background:var(--card);color:var(--m-p);font-size:.875rem;line-height:1.3;white-space:nowrap}
.kch b{color:var(--m-p);font-weight:600;font-variant-numeric:tabular-nums}
.kch.zero{background:none;box-shadow:inset 0 0 0 1px var(--m-ov)}
.kch.ok{background:var(--m-okc);color:var(--m-onokc)}.kch.ok b{color:var(--m-onokc)}
/* Espaço apertado: três colunas, rótulo em cima e valor embaixo */
@container (max-width:420px){.kchs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}.kch{flex-direction:column;align-items:center;gap:2px;padding:8px 4px;border-radius:var(--r-l);text-align:center}}
/* Rótulo longo (R2 · Ciclo 12) em tela estreita: fonte e espaços menores */
@container (max-width:340px){.kchs.lng{gap:4px}.kchs.lng .kch{font-size:.75rem}}
#app .mdup{display:none}
.chead:has(>h2.mdup:only-child){display:none}
/* Cartões */
.card{background:var(--card);border:1px solid color-mix(in srgb,var(--line) 55%,transparent);border-radius:28px;box-shadow:var(--sh);padding:20px;margin-bottom:18px}
.card.empty{padding:20px}
.rgv,.ritem{border-color:var(--line)}
/* Controles */
input,textarea{border:1.5px solid var(--line);border-radius:12px;padding:9px 12px;background:var(--bg)}
input:focus,textarea:focus{border-color:var(--ac)}
input[type=checkbox]{border-radius:4px}

.rcar{position:absolute;top:50%;z-index:1;width:32px;height:32px;margin-top:-16px;border:0;border-radius:999px;padding:0;display:grid;place-items:center;cursor:pointer;background:var(--m-c-high);color:var(--ink);box-shadow:var(--e1);transition:background-color .2s var(--emph)}
.rcar:hover{background:color-mix(in srgb,var(--ink) 8%,var(--m-c-high))}
.rcar.l{left:-6px}.rcar.r{right:-6px}
.rcar[hidden]{display:none}
/* Esmaecido na borda em que há grupos escondidos, para a setinha não cobrir o botão */
.rcscr>.rcchips{-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 var(--ml,0px),#000 calc(100% - var(--mr,0px)),transparent 100%);mask-image:linear-gradient(90deg,transparent 0,#000 var(--ml,0px),#000 calc(100% - var(--mr,0px)),transparent 100%)}
.rcscr.fl{--ml:44px}.rcscr.fr{--mr:44px}
@media (pointer:coarse){.rcar{display:none}}
/* Entrada das janelas: diálogo com fade e leve aumento; painel do celular sobe de baixo; desaceleração do Material */
@keyframes ovIn{from{opacity:0}}
@keyframes dlgIn{from{opacity:0;transform:scale(.96)}}
@keyframes sheetIn{from{opacity:0;transform:translateY(30%)}}
.ov.enter{animation:ovIn .3s cubic-bezier(.05,.7,.1,1)}
.dlg.enter{animation:dlgIn .3s cubic-bezier(.05,.7,.1,1)}
.dlg.fmd.enter{animation:none}
@media (max-width:600px){body .dlg.enter:is(.edlg,.medit,.plans,.reg:not(.fmd),.addm,.rgpop,.pdadd){animation-name:sheetIn}}
/* Saída das janelas: mais curta que a entrada e acelerando, no caminho inverso */
@keyframes ovOut{to{opacity:0}}
@keyframes dlgOut{to{opacity:0;transform:scale(.96)}}
@keyframes sheetOut{to{opacity:0;transform:translateY(30%)}}
#modalOut>*{pointer-events:none}
#modalOut>.ov.leave{animation:ovOut .26s cubic-bezier(.2,0,0,1) forwards}
#modalOut>.dlg.leave{animation:dlgOut .15s cubic-bezier(.3,0,.8,.15) forwards}
@media (max-width:600px){body #modalOut>.dlg.leave:is(.edlg,.medit,.plans,.reg:not(.fmd),.addm,.rgpop,.pdadd){animation-name:sheetOut;animation-duration:.18s}}
@media (prefers-reduced-motion:reduce){.ov.enter,.dlg.enter{animation:none}}
@media (prefers-reduced-motion:reduce){.btn,.x,.tbig,.fab,.seg,.row.srow,.sidenav button,.tabbar svg,.navmini .sidenav svg{transition:none}}

 if(k==='man'){S.sel.mt=f.get('m')||S.sel.mt||'';S.sel.md=f.get('d')||'';const mm=regMin(),nn=regErr();if(nn){ui.msg=nn.msg;ui.focus=nn.focus}else if(!canReg(mm)){ui.msg='Informe o tempo estudado.'}else if(mm>0||hasG()){addSession(mm);S.sel.mt='';S.timer={running:false,start:0,acc:0};S.sx=false}else ui.msg='Informe o tempo ou o tópico estudado.'}
 if(k==='plnew'){let n=(f.get('n')||'').trim();if(n){const base=n;for(let i=2;S.plans.some(x=>x.name.trim().toLowerCase()===n.toLowerCase());i++)n=base+' ('+i+')';const pl={id:uid(),name:n};S.plans.push(pl);S.planData[pl.id]=freshPlan();switchPlan(pl.id);S.editais.push({id:uid(),name:n,plan:pl.id});ui.pl=true;ui.ple=pl.id;tab='ciclo'}}
 if(k==='mat'){const n=(f.get('n')||S.sel.nn||'').trim(),g=tmParse(f.get('g'))||90,af=myEds().some(e=>e.id===S.sel.af)?S.sel.af:'';
  if(af&&S.sel.nnall){S.subjects.filter(s=>!s.of&&s.hid&&s.ed===af).forEach(s=>{delete s.hid;s.off=true;s.goal=g;S.subjects.push(S.subjects.splice(S.subjects.indexOf(s),1)[0])});S.sel.nn='';S.sel.nnall=false;ui.addm=null;ui.dd=null}
  else if(n&&af){let s0=S.sel.nnid?S.subjects.find(x=>x.id===S.sel.nnid):null;if(!s0||s0.name.toLowerCase()!==n.toLowerCase())s0=S.subjects.find(x=>!x.of&&x.ed===af&&x.name.toLowerCase()===n.toLowerCase());
   if(s0){if(s0.off){delete s0.hid;s0.goal=g;S.subjects.push(S.subjects.splice(S.subjects.indexOf(s0),1)[0])}}
   else{const eds=myEds(),eid=eds.some(x=>x.id===S.sel.af)?S.sel.af:eds.some(x=>x.id===S.sel.ne)?S.sel.ne:(eds[0]||(()=>{const d={id:uid(),name:'Meu edital',plan:S.plan};S.editais.push(d);return d})()).id,o={id:uid(),name:n,goal:g,topics:[],ed:eid,off:true};o.ci=nextCi();S.subjects.push(o)}
   S.sel.nn='';S.sel.nnid=null;ui.addm=null;ui.dd=null}}
 if(k==='pdnew'){const n=(f.get('n')||'').trim(),tp=parseTopics(f.get('t'));if(n){const ed=planEd();if(S.subjects.some(x=>!x.of&&ed.id===x.ed&&x.name.toLowerCase()===n.toLowerCase())){setTimeout(()=>toast('Já existe uma disciplina com esse nome neste plano.'),0)}else{const o={id:uid(),name:n,goal:90,topics:tp.map(x=>({id:uid(),name:x,done:false,links:[]})),ed:ed.id};o.ci=nextCi();S.subjects.push(o);ui.pdn=null;ui.open.add('pd:'+o.id)}}}
 if(k==='pdadd'&&ui.pdd){const D=ui.pdd,have=new Set(D.topics.map(x=>x.name.trim().toLowerCase()));D.nw=D.nw||[];parseTopics(f.get('t')).forEach(n=>{if(!have.has(n.toLowerCase())){have.add(n.toLowerCase());const id=uid();D.nw.push(id);D.topics.push({id,name:n})}});ui.pdadd=null;ui.pdmsg=null}
 if(k==='rvcfg'){const ri=String(f.get('i')||'').trim(),rw=String(f.get('w')||'').trim(),n=Number(ri),w=Number(rw),okN=x=>/^\d+$/.test(String(x))&&+x>=1&&+x<=60;
  if(!okN(ri)||!okN(rw)){ui.rvcfgmsg='Informe números inteiros de 1 a 60.'}
  else{const chI=n!==rvInt(),chW=w!==rvWait();let sp=null;if(chI){const I=rgInfo();S.rvlog=S.rvlog||[];S.rvlog.push({ts:Date.now(),de:rvInt(),para:n,dias:I.total,grupos:S.rgs.length});S.rvint=n;sp=rgApplyInt(n)}if(chW)S.rvwait=w;ui.rvcfg=null;ui.rvcfgmsg=null;
   setTimeout(()=>toast(!chI&&!chW?'Nada foi alterado.':'Salvo: grupos de '+n+' dia'+pl_(n)+' de estudo, disponíveis após '+w+' dia'+pl_(w)+' corrido'+pl_(w)+'.'+(sp>0?' O grupo em formação foi dividido.':'')),0)}}
 save();render();
});
/* Anotações dentro de <label> não marcam o checkbox ao clicar */
document.addEventListener('click',e=>{const n=e.target.closest&&e.target.closest('.nvw');if(n&&n.closest('label'))e.preventDefault()},true);
/* Histórico: busca e filtro de datas sem redesenhar a página toda */
(()=>{let tmr=null;const upd=()=>{if(tab!=='reg')return;const box=document.getElementById('hres');if(!box)return;const t=document.createElement('div');t.innerHTML=viewReg();const n=t.querySelector('#hres');if(n)box.replaceWith(n);const a=document.getElementById('hd1'),b=document.getElementById('hd2');if(a){if(ui.hd2)a.max=ui.hd2;else a.removeAttribute('max')}if(b){if(ui.hd1)b.min=ui.hd1;else b.removeAttribute('min')}['hd1','hd2'].forEach(k=>{const v=document.getElementById(k+'v');if(v){v.innerHTML=(ui[k]?fd(ui[k]):'')+CALI;v.parentNode.classList.toggle('on',!!ui[k])}})};
document.addEventListener('click',e=>{const i=e.target&&(e.target.id==='hd1'||e.target.id==='hd2')?e.target:null;if(i&&typeof i.showPicker==='function'){try{i.showPicker()}catch(x){}}});
document.addEventListener('input',e=>{const id=e.target&&e.target.id;if(id==='hq'){ui.hq=e.target.value;ui.hn=30;clearTimeout(tmr);tmr=setTimeout(upd,120)}else if(id==='hd1'||id==='hd2'){ui[id]=e.target.value;ui.hn=30;upd()}});
document.addEventListener('change',e=>{const id=e.target&&e.target.id;if((id==='hd1'||id==='hd2')&&ui[id]!==e.target.value){ui[id]=e.target.value;ui.hn=30;upd()}});})();
/* Espaço inicia/pausa o cronômetro */
(()=>{const vis=el=>el&&el.getClientRects().length>0;
document.addEventListener('keydown',e=>{if(e.code!=='Space'&&e.key!==' ')return;if(e.ctrlKey||e.metaKey||e.altKey||e.shiftKey||e.defaultPrevented)return;
 const t=e.target;if(t&&(t.isContentEditable||/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)))return;
 if(t&&t.closest&&t.closest('button,a,[role=button],summary')&&FOC.kb)return;
 if(e.repeat){e.preventDefault();return}
 const dlg=document.querySelector('#modal .dlg');let b=null;
 if(dlg){if(!dlg.classList.contains('reg')||S.edit)return;b=dlg.querySelector('[data-act=tpause],[data-act=tstart]');if(!vis(b))return}
 else{b=[...document.querySelectorAll('#app .nwplay')].find(vis);
  if(!b){if(S.edit)return;const id=selId(),s=S.subjects.find(x=>x.id===id);if(!s||(gDone(s)&&!(S.timer.running&&S.sel.subj===id)))return;
   b=document.createElement('button');b.type='button';b.hidden=true;b.dataset.act='rplay';b.dataset.id=id;document.getElementById('app').appendChild(b)}}
 e.preventDefault();e.stopPropagation();FOC.kb=false;b.click();if(b.hidden&&b.isConnected)b.remove()},true);})();
try{norm();setMode('study');if(!S.edit&&!S.sx&&!(S.timer&&(S.timer.running||S.timer.acc>0))){const c=current();if(c&&c.id!==S.sel.subj){S.sel.subj=c.id;S.sel.topic='';S.sel.groups=null}}}catch(x){}
render();
try{syInit()}catch(x){}

if('serviceWorker' in navigator&&!(window.claude&&typeof window.claude.use==='function')&&(location.protocol==='https:'||location.hostname==='localhost'))addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
